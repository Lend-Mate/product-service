spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service_db_dev
    username: lendmate
    password: lendmate
  jpa:
    show-sql: true
  main:
    allow-bean-definition-overriding: true

  elasticsearch:
    uris: http://localhost:9200
    repositories:
      enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.project.lendmate.event.StockDecreaseEvent

#  data:
#    redis:
#      host: localhost
#      port: 6379

logging:
  level:
    com:
      project:
        lendmate: DEBUG

