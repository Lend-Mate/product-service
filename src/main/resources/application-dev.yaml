spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service_db_dev
    username: lendmate
    password: lendmate
  jpa:
    show-sql: true
  main:
    allow-bean-definition-overriding: true

  elasticsearch:
    uris: http://localhost:9200
    repositories:
      enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.project.lendmate.event.StockDecreaseEvent

#logging:
#  level:
#    com:
#      project:
#        lendmate: DEBUG

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

server:
  shutdown: immediate
logging:
  level:
    com.project: INFO
    org.springframework.boot.actuator.autoconfigure.opentelemetry: DEBUG
    org.springframework.boot.docker.compose: DEBUG