name: Build and Deploy Spring Boot App
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests  # Testler zaten çalıştı

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: SERVER_INFO
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy and restart
        run: |
          scp -i ~/.ssh/deploy_key *.jar root@${{ vars.SERVER_HOST }}:/opt/lendmate/
          ssh -i ~/.ssh/deploy_key root@${{ vars.SERVER_HOST }} << 'EOF'
          cd /opt/lendmate
          pkill -f 'java -jar lendmate' || true
          sleep 2
          nohup java -jar lendmate-*.jar --spring.profiles.active=prod > app.log 2>&1 &
          EOF